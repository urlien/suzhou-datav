<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏州市数据可视化大屏</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="loading"><div class="spinner"></div><div id="loading-text">加载苏州市数据...</div></div>
<div id="app">
    <div id="stats">
      <div class="stat-card"><div class="stat-value">1274万</div><div class="stat-label">常住人口</div></div>
      <div class="stat-card"><div class="stat-value">2.4万亿</div><div class="stat-label">GDP</div></div>
      <div class="stat-card"><div class="stat-value">8657km²</div><div class="stat-label">面积</div></div>
      <div class="stat-card"><div class="stat-value">9</div><div class="stat-label">区县市</div></div>
    </div>
        <div id="stats">
      <div class="stat-card"><div class="stat-value">1274万</div><div class="stat-label">常住人口</div></div>
      <div class="stat-card"><div class="stat-value">2.4万亿</div><div class="stat-label">GDP</div></div>
      <div class="stat-card"><div class="stat-value">8657km²</div><div class="stat-label">面积</div></div>
      <div class="stat-card"><div class="stat-value">9</div><div class="stat-label">区县市</div></div>
    </div>
    <div id="header">
      <h1>苏州市城乡数据可视化平台</h1>
      <div id="clock"></div>
    </div>
    <div id="main">
      <div id="left-panel" class="panel">
        <div class="panel-title">📊 人口数据</div>
        <div id="chart-population" class="chart"></div>
        <div class="panel-title">🏭 产业结构</div>
        <div id="chart-industry" class="chart"></div>
      </div>
      <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="terrain-info"></div>
      </div>
      <div id="right-panel" class="panel">
        <div class="panel-title">🚗 交通流量</div>
        <div id="chart-traffic" class="chart"></div>
        <div class="panel-title">🏗️ 土地利用</div>
        <div id="chart-landuse" class="chart"></div>
      </div>
    </div>
    <div id="footer">
      <span>数据来源：苏州市自然资源和规划局 | ASTER GDEM V3</span>
      <span>苏州科技大学 城乡规划</span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<div id="legend">
  <div class="legend-title">人口密度</div>
  <div class="legend-bar"></div>
  <div class="legend-labels">
    <span>低</span><span>高</span>
  </div>
</div>

<div id="toolbar">
  <button class="tool-btn active" data-layer="terrain">地形</button>
  <button class="tool-btn active" data-layer="heatmap">热力图</button>
  <button class="tool-btn active" data-layer="boundary">边界</button>
</div>
